name: Set up the build
description: JDK 17, the Android SDK packages Loom compiles against, and Gradle with its cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platforms;android-37.0 build-tools;37.0.0
        log-accepted-android-sdk-licenses: false

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # The open-source cache on GitHub's own storage, not the default commercial service.
        cache-provider: basic
